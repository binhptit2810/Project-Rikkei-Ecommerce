plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'jacoco'
    id 'org.sonarqube' version '5.0.0.4638'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.ai:spring-ai-bom:1.0.0-M4'
    }
}

dependencies {
    // Spring Boot Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring AI OpenAI Starter (1.0.0-M4 tương thích Spring Boot 3.3.x)
    implementation 'org.springframework.ai:spring-ai-openai-spring-boot-starter'

    // Spring Data JPA & MySQL
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Spring Data Redis (tương thích Spring Boot 3.3.5 / Java 21)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Bucket4j Distributed Rate Limiting via Lettuce (Java 21 / Spring Boot 3.3.5)
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.14.0'
    implementation 'com.bucket4j:bucket4j_jdk17-redis-common:8.14.0'
    implementation 'com.bucket4j:bucket4j_jdk17-lettuce:8.14.0'

    // Spring Boot Starter Mail (cho gửi email OTP qua SMTP)
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Bean Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Actuator (Health check endpoint)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Spring Security & OAuth2 Client
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // JWT — JJWT 0.12.x (tương thích Spring Boot 3 / Java 21)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:testcontainers:1.19.8'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.8'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.11"
}

// Danh sách loại trừ các lớp cấu hình và boilerplate phi nghiệp vụ
def jacocoExclusions = [
    '**/*Application*',
    '**/config/**',
    '**/dto/**',
    '**/entity/**',
    '**/exception/**'
]

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = false
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExclusions)
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExclusions)
        }))
    }
    violationRules {
        rule {
            limit {
                minimum = 0.85
            }
        }
    }
}

sonar {
    properties {
        property "sonar.projectKey", "rikkei-ecommerce-backend"
        property "sonar.projectName", "Rikkei Ecommerce Backend"
        property "sonar.host.url", System.getenv("SONAR_HOST_URL") ?: "http://localhost:9000"
        property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"
        property "sonar.coverage.exclusions", "**/config/**, **/dto/**, **/entity/**, **/exception/**, **/*Application.*"
    }
}

bootRun {
    // Tự động tìm và nạp file .env từ thư mục cha hoặc thư mục hiện tại nếu có
    def envFile = rootProject.file("../.env").exists() ? rootProject.file("../.env") : file(".env")
    if (envFile.exists()) {
        envFile.eachLine("UTF-8") { line ->
            def trimmed = line.trim()
            if (trimmed && !trimmed.startsWith("#") && trimmed.contains("=")) {
                def parts = trimmed.split("=", 2)
                def key = parts[0].trim()
                def value = parts[1].trim()
                if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
                    value = value.substring(1, value.length() - 1)
                }
                environment key, value
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
