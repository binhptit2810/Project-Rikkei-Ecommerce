# =============================================================================
# application-docker.yml — Cấu hình ghi đè khi chạy trong Docker Compose
# =============================================================================

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/ecommerce_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:ecommerce_user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      # Không cấu hình password rỗng (${REDIS_PASSWORD:}) để tránh Lettuce gửi lệnh AUTH "" trong Docker.
      # Khi cần xác thực trong Docker, đặt biến môi trường SPRING_DATA_REDIS_PASSWORD trong compose/env.

logging:
  level:
    com.example.ecommerce: INFO
