# =============================================================================
# application.yml — Backend Configuration (Spring Boot)
# Cấu hình kết nối MySQL và thông số cơ bản cho sinh viên.
# =============================================================================

server:
  port: 8080

spring:
  application:
    name: ecommerce-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  # Serialize LocalDateTime thành ISO-8601 string thay vì array số
  jackson:
    serialization:
      write-dates-as-timestamps: false

# =============================================================================
# CORS Configuration
# =============================================================================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:*}

# =============================================================================
# JWT Authentication
# =============================================================================
jwt:
  # Secret phải >= 32 ký tự (256 bit) cho HMAC-SHA256
  # Trong production: đặt biến môi trường JWT_SECRET
  secret: ${JWT_SECRET:ecommerce-platform-default-dev-secret-change-this-in-production-2024}
  # Thời hạn token tính bằng millisecond (mặc định: 24h = 86400000ms)
  expiration: ${JWT_EXPIRATION:86400000}

# Actuator (health check)
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.example.ecommerce: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
