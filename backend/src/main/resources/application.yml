# =============================================================================
# application.yml — Backend Configuration (Spring Boot)
# Cấu hình kết nối MySQL và thông số cơ bản cho sinh viên.
# =============================================================================

server:
  port: 8080

spring:
  application:
    name: ecommerce-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  # Serialize LocalDateTime thành ISO-8601 string thay vì array số
  jackson:
    serialization:
      write-dates-as-timestamps: false

  # Cấu hình tải lên tệp ảnh (Multipart)
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # Redis Configuration (cho Refresh Token & Session Management)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Không cấu hình password rỗng (${REDIS_PASSWORD:}) vì sẽ khiến Lettuce gửi lệnh AUTH "" tới Redis không có mật khẩu.
      # Khi cần xác thực, Spring Boot tự động map biến môi trường SPRING_DATA_REDIS_PASSWORD hoặc khai báo spring.data.redis.password.
      timeout: 2000ms

  # Cấu hình gửi Mail qua SMTP (hỗ trợ Gmail, Resend,... qua Port 587 STARTTLS hoặc Port 465 SSL)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:binhbadboy2810@gmail.com}
    password: ${MAIL_PASSWORD:dcibqbxtoxfcghiq}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SMTP_SSL_ENABLE:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# =============================================================================
# CORS Configuration
# =============================================================================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# =============================================================================
# JWT & Refresh Token Authentication
# =============================================================================
jwt:
  # Secret phải >= 32 ký tự (256 bit) cho HMAC-SHA256
  # Trong production: đặt biến môi trường JWT_SECRET
  secret: ${JWT_SECRET:ecommerce-platform-default-dev-secret-change-this-in-production-2024}
  # Thời hạn Access Token tính bằng millisecond (mục tiêu: 15 phút = 900000ms)
  expiration: ${JWT_EXPIRATION:900000}
  # Thời hạn Refresh Token tính bằng millisecond (mục tiêu: 7 ngày = 604800000ms)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  # Thời gian ân hạn xoay vòng Refresh Token tính bằng millisecond (mục tiêu: 10 giây = 10000ms)
  grace-period: ${JWT_GRACE_PERIOD:10000}
  cookie:
    name: refresh_token
    path: /api/v1/auth
    secure: ${JWT_COOKIE_SECURE:false}
    same-site: ${JWT_COOKIE_SAME_SITE:Lax}

# Cấu hình ứng dụng
app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
  mail:
    from: ${MAIL_FROM:binhbadboy2810@gmail.com}
  otp:
    hmac-secret: ${OTP_HMAC_SECRET:ecommerce-default-otp-hmac-secret-change-in-production-2024}
    expiration-seconds: 300
    rate-limit-seconds: 60
    max-attempts: 5

# Actuator (health check)
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.example.ecommerce: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
