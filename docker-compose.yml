# =============================================================================
# docker-compose.yml — E-commerce Platform (TSK-D13-DHA)
# Phụ trách: Đỗ Hoàng Anh (MSV: B24DTCN300)
#
# Khởi động toàn bộ hệ thống bằng 1 lệnh duy nhất:
#   docker compose up -d
#
# Bao gồm đúng 4 Containers:
#   1. Container mysql    — MySQL 8.0 Database (port 3306)
#   2. Container redis    — Redis 7 Alpine Cache & Rate Limiting (port 6379)
#   3. Container backend  — Spring Boot 3 Java 21 REST API (port 8080)
#   4. Container frontend — React/Vite SPA + Nginx Reverse Proxy (port 3000)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Container 1: MySQL 8.0 Database
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_db}
      MYSQL_USER: ${MYSQL_USER:-ecommerce_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      # Volume lưu trữ dữ liệu MySQL bền vững
      - mysql_data:/var/lib/mysql
      # Tự động nạp schema, dữ liệu mẫu và migration khi khởi tạo lần đầu
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecommerce-net

  # ---------------------------------------------------------------------------
  # Container 2: Redis 7 Alpine Cache & Session Store & Rate Limiter
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ecommerce-net

  # ---------------------------------------------------------------------------
  # Container 3: Spring Boot 3 Backend API (Java 21)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ecommerce_db}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${MYSQL_USER:-ecommerce_user}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${MYSQL_PASSWORD:-password}}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET:-ecommerce-platform-default-dev-secret-change-this-in-production-2024-secure-256bit}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      FRONTEND_OAUTH2_SUCCESS_URL: ${FRONTEND_OAUTH2_SUCCESS_URL:-http://localhost:3000/oauth2/redirect}
      FRONTEND_OAUTH2_FAILURE_URL: ${FRONTEND_OAUTH2_FAILURE_URL:-http://localhost:3000/login}
      UPLOAD_DIR: /app/uploads
      TZ: Asia/Ho_Chi_Minh
      GEMINI_API_KEY: ${GEMINI_API_KEY:-mock-gemini-key-placeholder}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-15}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@rikkei-shop.me}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Rikkei Store}
      MAIL_SMTP_SSL_ENABLE: ${MAIL_SMTP_SSL_ENABLE:-false}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
      MAIL_SMTP_STARTTLS_REQUIRED: ${MAIL_SMTP_STARTTLS_REQUIRED:-true}
      MAIL_DEV_FALLBACK_ENABLED: ${MAIL_DEV_FALLBACK_ENABLED:-true}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-2QXUI4J4}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-RAIQUIBGCARJHNLKZCPGUCUMRHQKGZDF}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:3000/orders/vnpay-return}
      VNPAY_VERSION: ${VNPAY_VERSION:-2.1.0}
      VNPAY_COMMAND: ${VNPAY_COMMAND:-pay}
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - ecommerce-net

  # ---------------------------------------------------------------------------
  # Container 4: React/Vite Frontend trên Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN:-}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:-}
    container_name: ecommerce-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecommerce-net

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  ecommerce-net:
    driver: bridge
