server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Giới hạn kích thước request body cho upload ảnh (tương thích tối đa 3 ảnh x 5MB) [TSK-D14-CCT]
    client_max_body_size 20M;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Docker internal DNS resolver (giúp Nginx cập nhật lại IP khi container backend restart/recreate)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    # Reverse proxy API về backend (khớp cả /api, /api/, /api/v1/...)
    # Dùng ^~ để ngăn regex location (static assets .png, .jpg) can thiệp vào /api/v1/uploads/**
    location ^~ /api {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Reverse proxy trực tiếp cho thư mục uploads
    location ^~ /uploads {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy cho luồng khởi tạo OAuth2 Google (/oauth2/authorization/google) [TSK-D15-CCT]
    location ^~ /oauth2 {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Reverse proxy cho callback OAuth2 từ Google (/login/oauth2/code/google) [TSK-D15-CCT]
    location ^~ /login/oauth2 {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Proxy actuator health (tùy chọn, dùng cho monitoring)
    location /actuator {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    # React Router — mọi route đều trả về index.html để client-side routing hoạt động đúng
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
